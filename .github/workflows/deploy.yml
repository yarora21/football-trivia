name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::666458383077:role/github-actions-deploy
          aws-region: us-east-1

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Install Lambda layer
        run: pip install -r lambdas/layers/xray/requirements.txt -t lambdas/layers/xray/python/

      - name: TypeScript type-check
        working-directory: infra
        run: npx tsc --noEmit

      - name: CDK synth
        working-directory: infra
        run: npx cdk synth

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: infra
        run: npx cdk deploy --require-approval never